# Bluetooth LE Peripheral mit Zephyr-NUS-Service (Nordic UART Service UUIDs)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="BLESerial-WB5MM"
CONFIG_BT_ZEPHYR_NUS=y

# Groessere ATT-MTU zulassen (Central muss sie aushandeln):
# 247 Byte MTU => 244 Byte Nutzdaten pro Notification
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Bridge-UART (LPUART1, interruptgesteuert mit Ringpuffern)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Status-/Diagnoseausgaben auf der ST-LINK-VCP-Konsole (USART1)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

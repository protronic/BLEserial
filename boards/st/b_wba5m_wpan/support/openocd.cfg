# Note: Using OpenOCD on stm32wba requires a recent or patched openocd tool.

source [find interface/stlink-dap.cfg]

set WORKAREASIZE 0x8000

transport select "dapdirect_swd"

# Enable debug when in low power modes
set ENABLE_LOW_POWER 1

# Stop Watchdog counters when halt
set STOP_WATCHDOG 1

# STlink Debug clock frequency
set CLOCK_FREQ 8000

# Reset configuration: use hardware reset, connect under reset
reset_config srst_nogate

if {[catch {ocd_find target/stm32wba5x.cfg} t]==0} {
	source [find target/stm32wba5x.cfg]
} else {
	source [find target/stm32wbax.cfg]
}
